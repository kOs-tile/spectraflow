name: reliability-interview-demo

on:
  pull_request:
    paths:
      - "examples/reliability_interview_demo.py"
      - "tests/test_reliability_interview_demo.py"
      - "docs/RELIABILITY_INTERVIEW_DEMO.md"
      - ".github/workflows/reliability-interview-demo.yml"
  push:
    branches: [main]
    paths:
      - "examples/reliability_interview_demo.py"
      - "tests/test_reliability_interview_demo.py"
      - "docs/RELIABILITY_INTERVIEW_DEMO.md"
      - ".github/workflows/reliability-interview-demo.yml"

permissions:
  contents: read

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check pytest
      - run: python -m pytest -q tests/test_reliability_interview_demo.py
      - run: python examples/reliability_interview_demo.py --controls-only
