name: reliability-fast

on:
  push:
    paths:
      - "spectraflow/reliability/**"
      - "benchmark/**"
      - "tests/test_recovery.py"
      - "tests/test_recovery_benchmark.py"
      - "tests/test_execution_trace_benchmark.py"
      - "tests/test_kavi_runtime_trace_benchmark.py"
      - "tests/test_reliability_lab_v1.py"
      - ".github/workflows/reliability-fast.yml"
  pull_request:
    paths:
      - "spectraflow/reliability/**"
      - "benchmark/**"
      - "tests/test_recovery.py"
      - "tests/test_recovery_benchmark.py"
      - "tests/test_execution_trace_benchmark.py"
      - "tests/test_kavi_runtime_trace_benchmark.py"
      - "tests/test_reliability_lab_v1.py"
      - ".github/workflows/reliability-fast.yml"

jobs:
  reliability:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check pytest pytest-asyncio pydantic pydantic-settings
      - run: >-
          pytest -q
          tests/test_recovery.py
          tests/test_recovery_benchmark.py
          tests/test_execution_trace_benchmark.py
          tests/test_kavi_runtime_trace_benchmark.py
          tests/test_reliability_lab_v1.py
