name: reliability-fast

on:
  push:
    paths:
      - "spectraflow/reliability/**"
      - "benchmark/**"
      - "tests/test_recovery.py"
      - "tests/test_recovery_benchmark.py"
      - "tests/test_execution_trace_benchmark.py"
      - "tests/test_kavi_runtime_trace_benchmark.py"
      - "tests/test_reliability_lab_v1.py"
      - "tests/test_reliability_live_plan.py"
      - "tests/test_kavi_live_adapter.py"
      - "tests/test_kavi_live_collector.py"
      - "tests/test_reliability_local_harness.py"
      - "tests/test_reliability_live_collector.py"
      - "tests/test_reliability_harness_cli.py"
      - "tests/test_kavi_runtime_shim.py"
      - "tests/test_reliability_remote_bridge.py"
      - "tests/test_reliability_canary_readiness.py"
      - "tests/test_reliability_canary_readiness_cli.py"
      - "tests/test_reliability_canary_remote_cli.py"
      - "tests/test_reliability_local_preflight.py"
      - "tests/test_reliability_hook_attestation.py"
      - "tests/test_reliability_live_analysis.py"
      - "tests/test_benchmark_v1_schema.py"
      - "tests/test_benchmark_v1_metrics.py"
      - "tests/test_benchmark_v1_sparse_evidence.py"
      - "tests/test_real_agent_v1_runner.py"
      - "tests/test_live_benchmark_v1_adapter.py"
      - "tests/test_reliability_live_benchmark_v1.py"
      - "tests/test_reliability_canary_promotion.py"
      - "tests/test_reliability_live_corpus.py"
      - "tests/test_reliability_runtime_package.py"
      - ".github/workflows/reliability-fast.yml"
  pull_request:
    paths:
      - "spectraflow/reliability/**"
      - "benchmark/**"
      - "tests/test_recovery.py"
      - "tests/test_recovery_benchmark.py"
      - "tests/test_execution_trace_benchmark.py"
      - "tests/test_kavi_runtime_trace_benchmark.py"
      - "tests/test_reliability_lab_v1.py"
      - "tests/test_reliability_live_plan.py"
      - "tests/test_kavi_live_adapter.py"
      - "tests/test_reliability_local_harness.py"
      - "tests/test_kavi_live_collector.py"
      - "tests/test_reliability_live_collector.py"
      - "tests/test_reliability_harness_cli.py"
      - "tests/test_kavi_runtime_shim.py"
      - "tests/test_reliability_remote_bridge.py"
      - "tests/test_reliability_canary_readiness.py"
      - "tests/test_reliability_hook_attestation.py"
      - "tests/test_reliability_live_analysis.py"
      - "tests/test_benchmark_v1_schema.py"
      - "tests/test_benchmark_v1_metrics.py"
      - "tests/test_benchmark_v1_sparse_evidence.py"
      - "tests/test_real_agent_v1_runner.py"
      - "tests/test_live_benchmark_v1_adapter.py"
      - ".github/workflows/reliability-fast.yml"

jobs:
  reliability:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check pytest pytest-asyncio pydantic pydantic-settings
      - run: python -m pip install --disable-pip-version-check --no-deps -e .
      - run: >-
          pytest -q
          tests/test_recovery.py
          tests/test_recovery_benchmark.py
          tests/test_execution_trace_benchmark.py
          tests/test_kavi_runtime_trace_benchmark.py
          tests/test_reliability_lab_v1.py
          tests/test_reliability_live_plan.py
          tests/test_kavi_live_adapter.py
          tests/test_kavi_live_collector.py
          tests/test_reliability_local_harness.py
          tests/test_reliability_live_collector.py
          tests/test_reliability_harness_cli.py
          tests/test_kavi_runtime_shim.py
          tests/test_reliability_remote_bridge.py
          tests/test_reliability_hook_attestation.py
          tests/test_reliability_canary_readiness.py
          tests/test_reliability_canary_readiness_cli.py
          tests/test_reliability_canary_remote_cli.py
          tests/test_reliability_local_preflight.py
          tests/test_reliability_live_analysis.py
          tests/test_benchmark_v1_schema.py
          tests/test_benchmark_v1_metrics.py
          tests/test_benchmark_v1_sparse_evidence.py
          tests/test_real_agent_v1_runner.py
          tests/test_live_benchmark_v1_adapter.py
          tests/test_reliability_live_benchmark_v1.py
          tests/test_reliability_canary_promotion.py
          tests/test_reliability_live_corpus.py
          tests/test_reliability_runtime_package.py
