name: portfolio-v3-browser-qa
on:
  pull_request:
    paths:
      - "portfolio/v3/**"
      - ".github/workflows/portfolio-v3-browser-qa.yml"
  push:
    branches: [main]
    paths:
      - "portfolio/v3/**"
      - ".github/workflows/portfolio-v3-browser-qa.yml"
permissions:
  contents: read
jobs:
  browser-and-screenshot-review:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install QA browser
        run: |
          python -m pip install --disable-pip-version-check playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Inspect desktop/mobile, exercise interaction, capture contact sheet inputs
        run: python portfolio/v3/qa_browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent-autopsy-v3-visual-qa
          path: portfolio/v3/qa-output/
          retention-days: 14
