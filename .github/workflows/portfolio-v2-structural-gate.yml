name: portfolio-v2-structural-gate
on:
  pull_request:
    paths:
      - "portfolio/v2/**"
      - ".github/workflows/portfolio-v2-structural-gate.yml"
  push:
    branches: [main]
    paths:
      - "portfolio/v2/**"
      - ".github/workflows/portfolio-v2-structural-gate.yml"
permissions:
  contents: read
jobs:
  structural:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python portfolio/v2/checks.py
